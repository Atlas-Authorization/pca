apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pca-proxy.fullname" . }}
  labels: {{- include "pca-proxy.labels" . | nindent 4 }}
data:
  pca-proxy.yaml: |
{{ include "pca-proxy.config" . | indent 4 }}
{{- if .Values.openapi }}
  openapi.yaml: |
{{ .Values.openapi | indent 4 }}
{{- end }}
