[package]
name = "pca-oprf-xcheck"
version = "0.0.0"
edition = "2021"
publish = false
description = "Cross-implementation reference runner: drives the independent `voprf` crate (curve25519-dalek) to produce and check RFC 9497 ristretto255-SHA512 messages."

[dependencies]
voprf = { version = "=0.5.0", features = ["danger"] }
rand_core = "0.6"
serde_json = "1"
hex = "0.4"

[workspace]
