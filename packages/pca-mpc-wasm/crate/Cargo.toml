[package]
name = "pca-mpc-wasm"
version = "0.1.0"
edition = "2021"
description = "Constant-time Ed25519 base-OT curve core (curve25519-dalek) compiled to WebAssembly, a drop-in constant-time replacement for @atlasauth/pca-mpc's pure-BigInt ec.ts."
license = "MIT"

[lib]
crate-type = ["cdylib"]

# curve25519-dalek supplies the audited, constant-time field + scalar-multiplication the pure-JS
# BigInt path in ec.ts cannot achieve (docs §7.1: constant-time is a genuine JS/runtime boundary).
# default-features=false drops `zeroize`/`rand`/`std`; `precomputed-tables` keeps the constant-time
# fixed-base ladder behind `EdwardsPoint::mul_base`.
[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["precomputed-tables"] }

# A small, dependency-free WASM: no std, no allocator, no imports — all I/O is through fixed static
# buffers in linear memory, so the module instantiates with an empty import object.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
