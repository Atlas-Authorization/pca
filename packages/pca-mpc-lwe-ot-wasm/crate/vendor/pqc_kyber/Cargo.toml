[package]
edition = "2018"
name = "pqc_kyber"
version = "0.7.1"
authors = ["Mitchell Berry <foss@mitchellberry.com>"]
description = "A rust implementation of the post-quantum Kyber KEM algorithm"
documentation = "https://docs.rs/crate/pqc_kyber/"
readme = "readme.md"
keywords = [
    "kyber",
    "kem",
    "key-exchange",
    "kex",
    "post-quantum",
]
categories = [
    "algorithms",
    "cryptography",
    "wasm",
    "no-std",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/Argyle-Software/kyber"

[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 0

[profile.test.build-override]
opt-level = 0

# VENDORED-ONLY CHANGE (algorithm source is byte-identical to crates.io pqc_kyber 0.7.1):
# crate-type is narrowed to ["rlib"]. Upstream declares ["cdylib","rlib"]; cargo then tries to build
# a std-less `cdylib` of pqc_kyber for wasm32-unknown-unknown, which has no panic handler and fails
# to link. As a pure dependency only the rlib is needed, so this narrowing is the manifest-only fix
# that lets the reference implementation link into @atlasauth/pca-mpc-lwe-ot-wasm's own cdylib.
[lib]
crate-type = ["rlib"]

[[bench]]
name = "api"
harness = false

[dependencies.aes]
