<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1348 840" width="1348" height="840" role="img" aria-labelledby="t d">
<title id="t">The PCA layered stack, L0 to L5</title>
<desc id="d">Six layers, each answering one clause of the proof, from attestation-derived identity at the base to ledger, revocation and beacons at the top, plus two optional accelerants: optimistic authorization with fraud proofs, and zero-knowledge compliance proofs.</desc>
<style>
text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#1c1c1f}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:26px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:14px;fill:#5f5f6b}
.h{font-size:16px;font-weight:650}
.h2{font-size:14px;font-weight:650}
.b{font-size:13px}
.s{font-size:12px;fill:#5f5f6b}
.xs{font-size:11px;fill:#9b9ba7}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#9b9ba7}
.w{fill:#fff}
.pd{fill:#5a3fd6}
.ad{fill:#0c7a52}
.rd{fill:#d6455d}
.lbl{font-size:12.5px;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.lbls{font-size:11.5px;fill:#5f5f6b;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.card{fill:#fbfbfd;stroke:#d8d8e0;stroke-width:1.5}
.node{fill:#fff;stroke:#d8d8e0;stroke-width:1.5}
.nodeP{fill:#f1edff;stroke:#7c5cff;stroke-width:1.5}
.nodeA{fill:#e5fbf1;stroke:#34e5a0;stroke-width:1.5}
.nodeI{fill:#1c1c1f;stroke:#1c1c1f;stroke-width:1.5}
.nodeR{fill:#fdecef;stroke:#d6455d;stroke-width:1.5}
.fillP{fill:#7c5cff}
.fillA{fill:#34e5a0}
.dash{stroke-dasharray:6 5}
.ln{stroke:#5f5f6b;stroke-width:1.5;fill:none}
.lnP{stroke:#7c5cff;stroke-width:1.5;fill:none}
.lnA{stroke:#34e5a0;stroke-width:2;fill:none}
.lnG{stroke:#9b9ba7;stroke-width:1.5;fill:none}
.lnR{stroke:#d6455d;stroke-width:1.5;fill:none}
.life{stroke:#d8d8e0;stroke-width:1.5;stroke-dasharray:3 5}
</style>
<defs>
<marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#5f5f6b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#1fc886" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#9b9ba7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5L1 8.5" fill="none" stroke="#d6455d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="card" x="0.75" y="0.75" width="1346.5" height="838.5" rx="18"/>
<text x="48" y="62" class="title" text-anchor="start" >The PCA stack</text>
<text x="48" y="88" class="sub" text-anchor="start" >Each layer is one clause of the proof. A resource server verifies all of them, offline, per action.</text>
<rect x="48" y="124" width="780" height="96" rx="12" class="node" />
<rect x="48" y="124" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="124" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="180.0" class="h w" text-anchor="middle" style="font-size:24px">L5</text>
<text x="148" y="154" class="h" text-anchor="start" >Ledger, revocation, beacons</text>
<text x="148" y="178" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Is it unrevoked, fresh and anchored?</text>
<text x="148" y="201" class="s" text-anchor="start" >Merkle transparency log  /  revocation non-membership proofs  /  dead-man beacons, freeze</text>
<rect x="48" y="234" width="780" height="96" rx="12" class="node" />
<rect x="48" y="234" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="234" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="290.0" class="h w" text-anchor="middle" style="font-size:24px">L4</text>
<text x="148" y="264" class="h" text-anchor="start" >Provenance taint</text>
<text x="148" y="288" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Is the lineage clean of untrusted influence?</text>
<text x="148" y="311" class="s" text-anchor="start" >Trusted vs untrusted input labels travel with the action and feed r(A)</text>
<rect x="48" y="344" width="780" height="96" rx="12" class="node" />
<rect x="48" y="344" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="344" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="400.0" class="h w" text-anchor="middle" style="font-size:24px">L3</text>
<text x="148" y="374" class="h" text-anchor="start" >Risk-adaptive threshold, trust budget</text>
<text x="148" y="398" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Is friction proportionate to risk, and is budget left?</text>
<text x="148" y="421" class="s" text-anchor="start" >r(A) maps to t in {1, 2, 3}  /  budget B bounds  Σ r ≤ bMax / κ</text>
<rect x="48" y="454" width="780" height="96" rx="12" class="node" />
<rect x="48" y="454" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="454" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="510.0" class="h w" text-anchor="middle" style="font-size:24px">L2</text>
<text x="148" y="484" class="h" text-anchor="start" >Policy as co-signer</text>
<text x="148" y="508" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Did the policy cryptographically take part?</text>
<text x="148" y="531" class="s" text-anchor="start" >Policy VM releases the guardian share only for compliant actions  /  multi-sig or FROST</text>
<rect x="48" y="564" width="780" height="96" rx="12" class="node" />
<rect x="48" y="564" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="564" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="620.0" class="h w" text-anchor="middle" style="font-size:24px">L1</text>
<text x="148" y="594" class="h" text-anchor="start" >Plan commitment</text>
<text x="148" y="618" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Is the action a node of an authorized plan?</text>
<text x="148" y="641" class="s" text-anchor="start" >Merkle root of the plan DAG  /  per-action inclusion proof</text>
<rect x="48" y="674" width="780" height="96" rx="12" class="nodeP" />
<rect x="48" y="674" width="76" height="96" rx="12" class="fillP" />
<rect x="108" y="674" width="16" height="96" rx="0" class="fillP" />
<text x="86" y="730.0" class="h w" text-anchor="middle" style="font-size:24px">L0</text>
<text x="148" y="704" class="h" text-anchor="start" >Attestation-derived identity</text>
<text x="148" y="728" class="b" text-anchor="start" style="fill:#5a3fd6;font-weight:600">Is the actor the attested workload the grant names?</text>
<text x="148" y="751" class="s" text-anchor="start" >TEE quote of model, weights, runtime, operator  /  per-epoch key, no long-lived secret</text>
<text x="828" y="792" class="xs" text-anchor="end" >foundation: workload identity, taken down to the model</text>
<text x="860" y="112" class="eyebrow" text-anchor="start" >OPTIONAL ACCELERANTS</text>
<rect x="860" y="344" width="210" height="206" rx="12" class="nodeA" />
<text x="878" y="378" class="h ad" text-anchor="start" >Optimistic</text>
<text x="878" y="398" class="h2 ad" text-anchor="start" >+ fraud proofs</text>
<text x="878" y="430" class="s" text-anchor="start" >Reversible actions go on a</text>
<text x="878" y="447" class="s" text-anchor="start" >bonded claim of compliance.</text>
<text x="878" y="464" class="s" text-anchor="start" >A challenge window lets the</text>
<text x="878" y="481" class="s" text-anchor="start" >guardian or principal prove</text>
<text x="878" y="498" class="s" text-anchor="start" >fraud, which slashes the bond.</text>
<text x="878" y="532" class="eyebrow ad" text-anchor="start" >Latency</text>
<rect x="1090" y="234" width="210" height="426" rx="12" class="nodeA" />
<text x="1108" y="268" class="h ad" text-anchor="start" >Zero knowledge</text>
<text x="1108" y="288" class="h2 ad" text-anchor="start" >compliance proofs</text>
<text x="1108" y="320" class="s" text-anchor="start" >Prove the action derives</text>
<text x="1108" y="337" class="s" text-anchor="start" >from the committed plan</text>
<text x="1108" y="354" class="s" text-anchor="start" >under the policy, without</text>
<text x="1108" y="371" class="s" text-anchor="start" >revealing plan, policy or</text>
<text x="1108" y="388" class="s" text-anchor="start" >reasoning to the verifier.</text>
<text x="1108" y="642" class="eyebrow ad" text-anchor="start" >Privacy</text>
<text x="860" y="690" class="xs" text-anchor="start" >Both are additive. A deployment using neither</text>
<text x="860" y="706" class="xs" text-anchor="start" >still has the full L0-L5 core.</text>
<text x="48" y="812" class="s" text-anchor="start" >Adoption degrades gracefully: rung 0 is OAuth with proof of possession; each layer is independently adoptable.</text>
</svg>
