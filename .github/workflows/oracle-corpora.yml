name: Oracle corpora

# The ref-* differential corpora the native lanes replay (their test-data directories) are generated by tools/pca-audit/oracles/*.mts
# from the TypeScript reference. Nothing else checks that a lane's committed copy is what the reference produces today, so a stale
# build or a forgotten regeneration goes unnoticed. This workflow builds every package fresh, runs every corpus generator the way its
# header says (tsx with the oracles tsconfig, PCA_SEED_LOG for the seed labels), strips key material (strip-corpus-keys.py, the
# corpus-specific *-strip-keys.py, action-schema-strip.py), then diffs each regenerated corpus (decompressed) against the copy in every
# native repository at the same ref, prints the changed case names per corpus, uploads the whole regenerated set as the artifact
# `oracle-corpora`, and FAILS on any difference (including lane copies that disagree with each other).
# Generators read the public tree only: the withheld fixtures (packages/pca/fixtures/DISCLOSURE.md) are never an input.
# To refresh the lanes: download oracle-corpora and copy each corpus over the lane copies that differ.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:
    inputs:
      force_full:
        description: 'redo the work even when an earlier run passed on identical inputs'
        type: boolean
        default: false
      native_ref:
        description: 'Ref of the native repos (default: the ref of this run)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NATIVE_REF: ${{ inputs.native_ref || github.ref_name }}

jobs:
  reuse:
    name: reuse check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      hash: ${{ steps.reuse.outputs.hash }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      # input-hash reuse (ci-reuse.mjs): skipped when an earlier run recorded the same input hash (this tree plus the natives' tree at the ref).
      - id: reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full || inputs.full || vars.FORCE_FULL == '1' || contains(github.event.head_commit.message, '[force-full]') }}
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          PARTIAL: ${{ false }}
        run: node .github/scripts/ci-reuse.mjs check --workflow=oracle-corpora --self=.github/workflows/oracle-corpora.yml --exclude='docs/,examples/,*.md' --external=natives --ref="$NATIVE_REF" --always-full

  corpora:
    if: ${{ needs.reuse.outputs.skip != 'true' }}
    needs: reuse
    name: regenerated corpora equal every lane's committed copy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native repos at ${{ env.NATIVE_REF }}, their test-data is the committed copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lanes"
          for r in go python ruby php dotnet rust java kotlin swift; do
            url="https://github.com/${{ github.repository_owner }}/pca-$r.git"
            for i in $(seq 1 40); do
              git ls-remote --exit-code "$url" "refs/heads/$NATIVE_REF" "refs/tags/$NATIVE_REF" >/dev/null 2>&1 && break
              [ "$i" = 40 ] && { echo "::error::pca-$r has no ref '$NATIVE_REF' (push the native repos at the same ref)"; exit 1; }
              echo "waiting for pca-$r@$NATIVE_REF ($i/40)"; sleep 30
            done
            git clone -q --depth 1 --branch "$NATIVE_REF" "$url" "$RUNNER_TEMP/lanes/pca-$r"
            echo "pca-$r @ $(git -C "$RUNNER_TEMP/lanes/pca-$r" rev-parse HEAD)"
          done
      - name: Install every package, the generators import many of them
        run: pnpm install --frozen-lockfile
      - name: Build every package fresh (a stale dist must not produce a corpus)
        run: pnpm -r run build
      - name: Regenerate, strip, compare
        id: gen
        run: node .github/scripts/oracle-corpora.mjs --lanes="$RUNNER_TEMP/lanes" --report="$RUNNER_TEMP/oracle-report" --jobs=4
      - name: Keep the stripped set only, the -gen halves carry private keys and are never uploaded
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/oracle-report/corpora/*-gen.json.gz "$RUNNER_TEMP"/oracle-report/variants/*-gen.json.gz
          rm -rf "$RUNNER_TEMP/oracle-report/seed-labels"
          ls "$RUNNER_TEMP/oracle-report/corpora" 2>/dev/null | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-corpora
          path: |
            ${{ runner.temp }}/oracle-report/corpora
            ${{ runner.temp }}/oracle-report/variants
            ${{ runner.temp }}/oracle-report/REPORT.md
          if-no-files-found: ignore
          retention-days: 14

  reuse-record:
    name: reuse record
    needs: [reuse, corpora]
    if: ${{ !cancelled() && needs.reuse.outputs.skip != 'true' && needs.reuse.outputs.hash != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.corpora.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: rec
        env:
          GATE_FULL: ${{ inputs.full || (startsWith(github.ref_name, 'ci/') && endsWith(github.ref_name, '-rc') || startsWith(github.ref_name, 'ci/gate-')) || contains(github.event.head_commit.message, '[force-full]') }}
          HASH: ${{ needs.reuse.outputs.hash }}
        run: node .github/scripts/ci-reuse.mjs record --workflow=oracle-corpora --hash="$HASH" --out="$RUNNER_TEMP/reuse-record" --always-full
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rec.outputs.artifact }}
          path: ${{ runner.temp }}/reuse-record/
          retention-days: 21
