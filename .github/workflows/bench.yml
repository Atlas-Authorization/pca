name: Bench

# Cross-language performance gate (TypeScript flagship, tinybench). Generates the shared benchmark corpus (verify at 1/3/8 hops,
# classical and hybrid PQ, caveat-heavy policy, deny paths, canonicalize + hash, produce/sign; deterministic from seed labels, public
# data only) and checks it is reproducible, runs the harness three times on one fixed runner type (ubuntu-24.04), uploads the JSON,
# and compares against the committed packages/pca-bench/baselines/ts.json: a scenario fails only when its median regressed by more than
# the threshold (default 20%) AND an exact one-sided rank test over the pooled rounds of the three runs rejects "no change" (p < 0.05);
# one noisy run cannot fail it. No baseline yet: it passes with a notice. The deny-path rule (a refusal is never slower than the allow
# path it derives from) is checked on every run. Updating the baseline: see docs/pca/performance.md (the `bench-ts` artifact carries
# `bench-candidate.json`: commit it as packages/pca-bench/baselines/ts.json).
on:
  push:
    branches: ['ci/**', '!ci/build-**']
  workflow_dispatch:
    inputs:
      threshold:
        description: 'regression threshold as a fraction (default 0.20)'
        default: '0.20'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_THRESHOLD: ${{ inputs.threshold || '0.20' }}

jobs:
  bench:
    name: bench ts (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard pnpm filters (a --filter that matches no project fails the job)
        run: bash scripts/pnpm-filter-guard.sh
      - name: Install
        run: pnpm install --frozen-lockfile --filter=. --filter=@atlasauth/pca-bench...
      - name: Build the reference (and its workspace dependencies)
        run: pnpm -r --filter='@atlasauth/pca-bench^...' run build
      - name: Gate logic tests (statistics, regression rule, deny-path rule)
        run: pnpm --filter @atlasauth/pca-bench test
      - name: Corpus (deterministic, two generations are byte-identical)
        run: |
          set -euo pipefail
          node packages/pca-bench/gen-corpus.mjs > "$RUNNER_TEMP/corpus.json"
          node packages/pca-bench/gen-corpus.mjs | cmp - "$RUNNER_TEMP/corpus.json"
          echo "corpus digest $(node -p 'require(process.argv[1]).digest' "$RUNNER_TEMP/corpus.json")"
      - name: Benchmark (3 runs)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runs"
          for i in 1 2 3; do
            node packages/pca-bench/bench.mjs --corpus "$RUNNER_TEMP/corpus.json" --out "$RUNNER_TEMP/runs/r$i.json"
          done
      - name: Gate (regression vs the committed baseline, deny-path rule)
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/runs"
          node packages/pca-bench/compare.mjs merge "$R/bench-candidate.json" "$R"/r*.json
          args=(); for f in "$R"/r*.json; do args+=(--candidate "$f"); done
          node packages/pca-bench/compare.mjs gate --baseline packages/pca-bench/baselines/ts.json "${args[@]}" --threshold "$BENCH_THRESHOLD" --summary "$GITHUB_STEP_SUMMARY"
      - name: Results table (the docs page filled from this run)
        if: always()
        run: |
          cp docs/pca/guides/performance.md "$RUNNER_TEMP/runs/performance.md"
          node packages/pca-bench/compare.mjs docs "$RUNNER_TEMP/runs/performance.md" "$RUNNER_TEMP/runs/bench-candidate.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ts
          path: ${{ runner.temp }}/runs
