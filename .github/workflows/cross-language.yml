name: Cross-language gate

# One corpus, every verifier: the TypeScript reference (packages/pca, from source) and the native verifiers from their
# own public repos, checked out at the SAME ref as this run (a ci/** branch, a tag, or main), all run over the shared
# adversarial corpus + regressions + a seeded mutation fuzz by scripts/pca-conformance-all.mjs. Fails on any
# cross-language disagreement, crash or hang, or when any implementation did not run. All 9 native drivers: Linux runs 8
# (Swift needs CryptoKit), macOS runs all 9 in one comparison.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:
    inputs:
      native_ref:
        description: 'Ref of the native verifier repos (default: the ref of this run)'
        required: false
        default: ''
      fuzz:
        description: 'Mutation-fuzz iterations'
        required: false
        default: '3000'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BC_VERSION: '1.80'
  NATIVE_REF: ${{ inputs.native_ref || github.ref_name }}

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenSSL >= 3.5 (ubuntu-26.04): Ruby and PHP get ML-DSA from libcrypto. Swift is gated on macOS (CryptoKit).
          - name: all languages but Swift (Linux), 0 disagreements
            os: ubuntu-26.04
            langs: go,python,ruby,php,dotnet,rust,java,kotlin
          - name: all 9 languages (macOS), 0 disagreements
            os: macos-latest
            langs: go,python,ruby,php,dotnet,rust,java,kotlin,swift
    steps:
      - uses: actions/checkout@v4
      - name: Native verifiers at ${{ env.NATIVE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native" sdks
          for r in go python ruby php dotnet rust java kotlin swift; do
            url="https://github.com/${{ github.repository_owner }}/pca-$r.git"
            # the release-candidate push lands the flagship first: wait up to 20 min for each native repo's ref
            for i in $(seq 1 40); do
              git ls-remote --exit-code "$url" "refs/heads/$NATIVE_REF" "refs/tags/$NATIVE_REF" >/dev/null 2>&1 && break
              [ "$i" = 40 ] && { echo "::error::pca-$r has no ref '$NATIVE_REF' (push the native repos at the same ref)"; exit 1; }
              echo "waiting for pca-$r@$NATIVE_REF ($i/40)"; sleep 30
            done
            git clone -q --depth 1 --branch "$NATIVE_REF" "$url" "$RUNNER_TEMP/native/pca-$r"
            echo "pca-$r @ $(git -C "$RUNNER_TEMP/native/pca-$r" rev-parse HEAD)"
          done
          # the drivers expect the verifiers under sdks/<lang>-pca; the Rust verifier is one crate of the pca-rust workspace.
          # sdks/pca-less-c (libatlas_less for the FFI backends) ships in this repo.
          for r in go python ruby php dotnet java kotlin swift; do cp -R "$RUNNER_TEMP/native/pca-$r" "sdks/$r-pca"; done
          cp -R "$RUNNER_TEMP/native/pca-rust/crates/atlas-pca" sdks/rust-pca
      - name: Select Xcode 26 (CryptoKit ML-DSA for the Swift verifier)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go-pca/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, ffi
          ini-values: ffi.enable=true
          coverage: none
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      # JDK 23: the Java / Kotlin LESS backends use the FFM API (JDK 22+); the drivers pass --enable-native-access
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      # the Kotlin driver is compiled with the kotlin-compiler-embeddable jars a Gradle distribution ships in lib/.
      # 9.3.1 (Kotlin 2.2.21) is the distribution the gate is run with locally; 8.9 (Kotlin 1.9.x) ships no
      # kotlinx-coroutines-core-jvm in lib/, so the gate skipped Kotlin ("incomplete kotlin compiler jars") and failed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Kotlin compiler jars
        shell: bash
        run: |
          g="$(command -v gradle)"; home="$(cd "$(dirname "$(readlink -f "$g" 2>/dev/null || python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$g")")/.." && pwd)"
          # every jar scripts/pca-conformance-all.mjs kotlinToolchain() needs, so a short distribution fails here, by name
          for j in kotlin-compiler-embeddable- kotlin-stdlib- kotlin-script-runtime- kotlin-reflect- kotlin-daemon-embeddable- kotlinx-coroutines-core-jvm- annotations-; do
            ls "$home/lib" | grep -E "^$j.*\.jar$" >/dev/null || { echo "::error::no $j*.jar in $home/lib"; exit 1; }
          done
          echo "PCA_KOTLIN_LIB=$home/lib" >> "$GITHUB_ENV"
      - name: Install (reference implementation + corpus generator)
        run: pnpm install --frozen-lockfile --filter=. --filter=@atlasauth/pca... --filter=@atlasauth/pca-conformance...
      - name: Build (the reference loads its built workspace dependencies)
        run: pnpm -r --filter=@atlasauth/pca... --filter=@atlasauth/pca-conformance... run build
      - name: BouncyCastle for the Java / Kotlin verifiers
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bcprov.jar" "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/${BC_VERSION}/bcprov-jdk18on-${BC_VERSION}.jar"
          echo "PCA_BC_JAR=$RUNNER_TEMP/bcprov.jar" >> "$GITHUB_ENV"
      - name: Python verifier backends
        run: python -m pip install cryptography dilithium-py
      - name: Corpus regenerates byte-identically
        run: packages/pca/node_modules/.bin/tsx packages/pca-conformance/adversarial/gen-adversarial.ts --check
      # the full adversarial set (.gz: fixed header, decompressed content compared, so Linux and macOS check the same bytes)
      - name: Adversarial vector set regenerates identically
        run: node --stack-size=4000 packages/pca/scripts/gen-conformance-adv.mjs --check
      - name: Every language over the corpus (libatlas_less is built from sdks/pca-less-c for the FFI backends)
        run: >
          scripts/pca-conformance-all.sh --no-native --langs ${{ matrix.langs }} --require ${{ matrix.langs }}
          --fuzz ${{ inputs.fuzz || '3000' }} --out "$RUNNER_TEMP/pca-conformance-all"
      - name: Upload matrix + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-matrix-${{ runner.os }}
          path: |
            ${{ runner.temp }}/pca-conformance-all/MATRIX.md
            ${{ runner.temp }}/pca-conformance-all/report.json
          if-no-files-found: ignore
