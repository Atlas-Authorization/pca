\* TLC config for capability-chain attenuation (the SHIPPED append-only verifier).
\* 2 verbs, 2 resources, blast levels 0..2, chains up to depth 4.
\* AllowWiden = FALSE: only legal (append-only) hops -> Monotone should HOLD.
SPECIFICATION Spec

CONSTANTS
    Verbs = {v1, v2}
    Resources = {r1, r2}
    MaxBlast = 2
    MaxDepth = 4
    AllowWiden = FALSE

INVARIANT TypeOK
INVARIANT Invariant
