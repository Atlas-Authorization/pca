\* NEGATIVE CONTROL.  AllowWiden = TRUE lets a hop illegally DROP a parent caveat
\* (the widening the shipped verifyChain rejects via its prefix-equality check).
\* TLC MUST report a counterexample to Invariant (Monotone / PrefixPreserved),
\* demonstrating the monotonicity invariant is non-vacuous: without the prefix rule,
\* a child CAN out-scope its parent.
SPECIFICATION Spec

CONSTANTS
    Verbs = {v1, v2}
    Resources = {r1, r2}
    MaxBlast = 2
    MaxDepth = 4
    AllowWiden = TRUE

INVARIANT TypeOK
INVARIANT Invariant
