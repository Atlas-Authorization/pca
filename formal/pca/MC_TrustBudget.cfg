\* TLC config for the PCA trust-budget admission controller.
\* Grid size 6: risk levels 0..6 (r = R/6); budget 0..6 (bMax = 1.0).
\* theta1 = 2/6 ~ 0.33, theta2 = 4/6 ~ 0.67 (near the shipped defaults 0.25 / 0.6).
\* kappa = 1, so the a-priori blast-radius bound is bMax/kappa = 6 grid units (= 1.0).
SPECIFICATION Spec

CONSTANTS
    GRID = 6
    Bmax = 6
    Kappa = 1
    Theta1 = 2
    Theta2 = 4
    Lambda = 1
    Rho = 3
    RLCooldown = 2

INVARIANT Invariant
