\* Hardened design, atomic admission.  Expected: no error.  (Large: NG=2 + BeaconMode. For a first run lower NG to 1 and AdmLimit to 2.)
SPECIFICATION Spec
CONSTANTS
  NG = 2
  MaxCtr = 2
  MaxEpochClaim = 1
  Theta1 = 1
  Theta2 = 2
  Kappa = 1
  BMax = 3
  Rho = 2
  RiskMax = 3
  AdmLimit = 3
  RevLimit = 1
  FreezeLimit = 1
  LeakLimit = 1
  DelLimit = 1
  BeaconLimit = 2
  Interleave = FALSE
  Recheck = FALSE
  BeaconMode = TRUE
INVARIANT Safety
PROPERTY RevocationStable CounterMonotone LedgerAppendOnly BudgetRisesOnlyByHuman RevokedGrantStaysDead
