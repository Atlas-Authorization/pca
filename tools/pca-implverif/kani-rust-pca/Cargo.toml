[package]
name = "atlas-pca-kani"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/kroot.rs"

[dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
fips204 = "0.4"
# the remaining signature-suite verifiers of sdks/rust-pca (same versions and features)
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128f", "slh_dsa_sha2_256s"] }
fn-dsa-vrfy = "0.4"
# vendor hardware-attestation verifiers (attest/)
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
sha1 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[features]
b64wrap = []
