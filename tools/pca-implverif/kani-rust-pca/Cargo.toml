[package]
name = "atlas-pca-kani"
version = "0.0.0"
edition = "2021"
publish = false
# build.sh copies the library's src/ tree, including src/bin: those are the SDK's binaries (they name the atlas_pca crate), not harness targets
autobins = false

[lib]
path = "src/kroot.rs"

[dependencies]
ed25519-dalek = "2"
curve25519-dalek = "4"
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
base64 = "0.22"
getrandom = "0.2"
unicode-normalization = "0.1"
fips204 = "0.4"
# the remaining signature-suite verifiers of sdks/rust-pca (same versions and features)
fips205 = { version = "0.4", default-features = false, features = ["slh_dsa_sha2_128f", "slh_dsa_sha2_256s", "default-rng"] }
fn-dsa-vrfy = "0.4"
# vendor hardware-attestation verifiers (attest/)
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rsa = "0.9"
sha1 = "0.10"
# wipes secret key buffers on drop (agent.rs)
zeroize = "1"
# the remaining dependencies of sdks/rust-pca's default build (same versions and features): the harness crate compiles every module
# build.sh copies, so a dependency added to the library must be added here (run 45568594863: regex, hmac, hkdf, url, p521, aes-gcm,
# ml-kem, sha3, blst and yaml-rust2 were unresolved)
url = "2"
regex = "1"
hmac = "0.12"
hkdf = "0.12"
p521 = { version = "0.13.3", features = ["ecdsa"] }
aes-gcm = "0.10"
ml-kem = { version = "0.2", features = ["deterministic"] }
sha3 = "0.10"
blst = "0.3"
yaml-rust2 = { version = "0.13", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "allow" }

[features]
b64wrap = []
