[package]
name = "stark-pca-plonky3"

version = "0.1.0"
edition = "2021"
description = "Transparent, post-quantum STARK (Plonky3, Goldilocks small-field FRI) proof of the PCA release gate — the maintained replacement for the Winterfell stark-pca crate"
license = "MIT OR Apache-2.0"

[dependencies]
# Plonky3 — actively-maintained, audited small-field transparent STARK toolkit.
p3-air = "0.8.0"
p3-field = "0.8.0"
p3-goldilocks = "0.8.0"
p3-matrix = "0.8.0"
p3-uni-stark = "0.8.0"
p3-fri = "0.8.0"
p3-merkle-tree = "0.8.0"
p3-symmetric = "0.8.0"
p3-challenger = "0.8.0"
p3-commit = "0.8.0"
p3-dft = "0.8.0"
p3-poseidon2 = "0.8.0"
p3-poseidon2-air = "0.8.0"
rand = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
opt-level = 3

[lib]
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "allow" }
