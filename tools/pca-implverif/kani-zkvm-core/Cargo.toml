[package]
name = "pca-zkvm-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
base64 = "0.22"
regex = "1"
ed25519-dalek = "2"
curve25519-dalek = "4"

[lints.rust]
unexpected_cfgs = { level = "allow" }
